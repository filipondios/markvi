[package]
name = "markvi-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A local Markdown viewer and editor with Vim-style keybindings"
license = "MIT"
publish = false

[[bin]]
name = "markvi"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
notify = "8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
futures-core = "0.3"
# buffer_unordered para el escaneo concurrente; ya está en el árbol vía axum,
# evita añadir el meta-crate `futures` completo.
futures-util = "0.3"
# ServeFile da Range/HEAD para multimedia; tower aporta `oneshot`.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
