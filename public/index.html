<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>markvi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="bar">
      <div id="bar-row">
        <a href="/">markvi</a>
        <span id="path"></span>
        <div id="actions">
          <button id="mode" type="button" aria-label="Editar (a)" title="Editar (a)">Editar</button>
        </div>
      </div>
      <div id="tabs" role="tablist" aria-label="Pestañas" hidden></div>
    </header>
    <main id="content"></main>
    <div id="prompt" hidden>
      <span id="prompt-prefix"></span>
      <input
        id="prompt-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        aria-label="Comando"
      />
    </div>
    <footer id="status" role="status" aria-live="polite">
      <span id="status-mode">Índice</span>
      <span id="status-vim"></span>
      <span id="status-state">Listo</span>
      <span id="status-message"></span>
      <span id="status-actions"></span>
    </footer>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
